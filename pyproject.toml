[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dataguard"
version = "0.1.0"
description = "Config-driven data validation framework for ETL pipelines"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "pandas>=1.5",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
s3 = ["s3fs>=2023.1", "fsspec>=2023.1"]
azure = ["adlfs>=2023.1", "fsspec>=2023.1"]
gcs = ["gcsfs>=2023.1", "fsspec>=2023.1"]
snowflake = ["snowflake-connector-python>=3.0"]
databricks = ["databricks-sql-connector>=2.0"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "mypy>=1.0",
    "pandas-stubs",
    "pyarrow>=12.0",
]

[project.scripts]
dataGuard = "dataguard.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dataguard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py39"
